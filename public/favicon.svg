  </defs>
  <rect width="32" height="32" rx="7" fill="#002c8b"/>
  <circle cx="16" cy="16" r="11" fill="url(#glow)"/>
  <rect x="3.1" y="3.1" width="25.8" height="25.8" rx="4.6" fill="none" stroke="#f2f5ff" stroke-width="1.1" opacity="0.85"/>
