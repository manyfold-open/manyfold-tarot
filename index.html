<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The one image the visitor meets before they have chosen anything: the
         deck, face down, 78 times over. Fetched up front so the table is never
         laid with blank cards. The faces are deliberately not preloaded — the
         browser is not told what was drawn until it is turned over. -->
    <link rel="preload" as="image" type="image/webp" href="/cards/back.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="三张牌，一次照见。 · Three cards, one clear look." />
    <title>AI Tarot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
